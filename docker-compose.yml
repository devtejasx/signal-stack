services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
  app:
    build: .
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      SIGNALSTACK_DB: /app/data/signalstack.db
    volumes: [./data:/app/data]
    ports: ["8000:8000"]
    depends_on: [ollama]
volumes:
  ollama: {}
